<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<title>NAKAMA – Schichtplan</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var s=localStorage.getItem("nakama_theme");
    var t=(s==="light"||s==="dark")?s:(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme", t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t==="light"?"#eef1f6":"#0b0d12");
  }catch(e){
    document.documentElement.setAttribute("data-theme","dark");
  }
})();
</script>
<style>
:root{
  --bg:#0b0d12;
  --elev:#14181f;
  --elev-2:#1c212b;
  --elev-3:#262c38;
  --hover:#2c3342;
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.16);
  --text:#f4f7fb;
  --text-dim:#c5cedf;
  --text-faint:#9aa6bd;
  --accent:#3ec8ff;
  --accent-ink:#041820;
  --accent-2:#18b0f0;
  --accent-text:#8ad8ff;
  --accent-soft:rgba(62,200,255,.16);
  --danger:#ff6b78;
  --ok:#3dd68c;
  --warn:#ffb020;
  --track:rgba(255,255,255,.08);
  --shadow:0 16px 50px rgba(0,0,0,.45);
  --font:"Outfit",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --radius:16px;
  --name-col:136px;
  --slot-min:58px;
  --row-h:52px;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#e7ebf2;
  --elev:#ffffff;
  --elev-2:#f5f7fb;
  --elev-3:#e8edf5;
  --hover:#e3e9f3;
  --line:#e1e6ef;
  --line-strong:#c9d2e0;
  --text:#12151c;
  --text-dim:#3d4658;
  --text-faint:#5c677c;
  --accent:#0a6ebd;
  --accent-ink:#ffffff;
  --accent-2:#085fa5;
  --accent-text:#075a9c;
  --accent-soft:rgba(10,110,189,.12);
  --track:#e4e9f1;
  --shadow:0 16px 40px rgba(18,24,38,.12);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
body::before,body::after{
  content:"";position:fixed;width:560px;height:560px;border-radius:50%;
  pointer-events:none;z-index:0;filter:blur(12px);
}
body::before{
  right:-200px;top:-240px;
  background:radial-gradient(circle, rgba(62,200,255,.28), transparent 68%);
  animation:drift 16s ease-in-out infinite;
}
body::after{
  left:-220px;bottom:-240px;
  background:radial-gradient(circle, rgba(176,120,255,.18), transparent 70%);
  animation:drift 20s ease-in-out infinite reverse;
}
@keyframes drift{50%{transform:translate3d(-28px,20px,0)}}
.shell{position:relative;z-index:1}
button,input{font-family:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}

.shell{
  height:100dvh;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.chrome{
  flex:0 0 auto;
  background:color-mix(in srgb, var(--elev) 78%, transparent);
  backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:1px solid var(--line);
  z-index:20;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 12px 0;
  min-height:48px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{
  width:36px;height:36px;border-radius:10px;display:block;
  background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.12);
}
.brand-name{
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:15px;line-height:1.1;
}
.brand-sub{
  color:var(--accent-text);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-top:2px;
}
.top-actions{display:flex;align-items:center;gap:6px;min-width:0}
.top-actions .icon-btn{width:40px;height:40px}
.icon-btn.is-on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sync{
  display:flex;align-items:center;gap:6px;min-width:0;
  color:var(--text-faint);font-family:var(--mono);font-size:11px;
}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 4px rgba(61,214,140,.12)}
.sync-dot.syncing{background:var(--warn);box-shadow:0 0 0 4px rgba(255,176,32,.15);animation:pulse .9s ease-in-out infinite}
.sync-dot.error{background:var(--danger);box-shadow:0 0 0 4px rgba(255,107,120,.15)}
.sync-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.45}}

.toolbar{display:flex;flex-direction:column;gap:6px;padding:6px 12px 6px}
.nav-cluster,.tool-cluster{display:flex;align-items:center;gap:8px;min-width:0}
.tool-cluster .btn{flex:1}
.day-label{
  flex:1;min-width:0;text-align:center;
  font-weight:600;font-size:15px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn,.icon-btn{
  height:44px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--elev-2);color:var(--text);
  font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 12px;
  transition:background .18s ease,transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s ease,border-color .18s ease;
}
.icon-btn{width:44px;padding:0;flex:0 0 auto}
@media (hover:hover) and (pointer:fine){
  .btn:hover,.icon-btn:hover{background:var(--hover);transform:translateY(-1px)}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(62,200,255,.28)}
}
.btn:active,.icon-btn:active,.day-chip:active{transform:scale(.96)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn svg,.icon-btn svg{width:18px;height:18px;flex:0 0 auto}

.day-strip{display:flex;gap:4px;padding:0 12px 6px}
.day-chip{
  flex:1;min-width:0;min-height:48px;border-radius:12px;
  border:1px solid transparent;background:transparent;color:var(--text-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:4px 0;
}
.day-chip .dc-wd{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.day-chip .dc-d{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text)}
.day-chip.is-today:not(.is-on){border-color:var(--accent);background:var(--accent-soft)}
.day-chip.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day-chip.is-on .dc-d{color:var(--accent-ink)}

.edit-banner{
  margin:0 12px 8px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(255,107,120,.1);
  border:1px solid rgba(255,107,120,.28);
  color:var(--text);
  font-size:13px;
  line-height:1.35;
}
.info-pop{
  position:fixed;
  z-index:45;
  width:min(320px, calc(100vw - 24px));
  padding:12px 14px;
  border-radius:14px;
  background:var(--elev);
  color:var(--text);
  border:1px solid var(--line-strong);
  box-shadow:var(--shadow);
  font-size:14px;
  line-height:1.45;
}
.stats{display:flex;border-top:1px solid var(--line)}
.stat{flex:1;text-align:center;padding:6px 4px 7px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat-num{font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:-.03em;line-height:1}
.stat.stat-pop .stat-num{animation:statPop .42s cubic-bezier(.16,1,.3,1)}
@keyframes statPop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.stat-lbl{margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}

.board-scroll{
  flex:1;min-height:0;overflow:auto;
  background:var(--elev);
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:var(--line-strong) transparent;
}
.board-scroll.is-day #board{min-width:max-content}
.board-scroll.is-week #board{width:100%;min-width:0}
body.has-assign .board-scroll{scroll-padding-bottom:88px}
body.has-assign #board{padding-bottom:92px}

.plan-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.plan-table th,.plan-table td{padding:0;vertical-align:middle}
.plan-table thead th{
  position:sticky;top:0;z-index:3;
  height:40px;min-width:var(--slot-min);
  background:var(--elev-2);color:var(--text-dim);
  font-family:var(--mono);font-size:11px;font-weight:600;
  text-align:center;border-bottom:1px solid var(--line);
}
.plan-table thead th.h-night{box-shadow:inset 0 -2px 0 #8b93ff}
.plan-table thead th.h-morning{box-shadow:inset 0 -2px 0 #e2b340}
.plan-table thead th.h-day{box-shadow:inset 0 -2px 0 var(--accent)}
.plan-table thead th.h-evening{box-shadow:inset 0 -2px 0 #c084fc}
.plan-table thead th.is-now{
  color:var(--accent-ink);background:var(--accent);box-shadow:none;height:46px;overflow:hidden;
}
.plan-table thead th.is-now::after{
  content:"";position:absolute;inset:5px 6px;border-radius:8px;pointer-events:none;
  box-shadow:0 0 18px var(--accent);
  animation:nowGlow 2.2s ease-in-out infinite;
}
@keyframes nowGlow{0%,100%{opacity:.35}50%{opacity:1}}
.now-tag{
  display:block;margin-top:1px;
  font-family:var(--font);font-size:8px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.th-name,.td-name{
  position:sticky;left:0;z-index:4;
  min-width:var(--name-col);max-width:168px;width:var(--name-col);
  background:var(--elev);
  border-right:1px solid var(--line);
}
.plan-table thead .th-name{
  z-index:5;text-align:left;padding-left:12px;
  font-family:var(--font);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
}
.board-scroll.scrolled-x .th-name,.board-scroll.scrolled-x .td-name{box-shadow:8px 0 16px -12px rgba(0,0,0,.7)}
.td-name{height:var(--row-h);border-bottom:1px solid var(--line)}
.who{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;min-width:0}
.who-text{min-width:0;flex:1}
.who-name{font-weight:700;font-size:13px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-sum{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:1px}
.del-btn{
  display:none;
  width:36px;height:36px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--text-faint);font-size:18px;line-height:1;flex:0 0 auto;
  place-items:center;
}
body.is-editing .del-btn{display:grid}
.del-btn:hover{background:rgba(255,107,120,.12);color:var(--danger);border-color:rgba(255,107,120,.3)}
.td-slot{
  min-width:var(--slot-min);height:var(--row-h);
  border-bottom:1px solid var(--line);border-right:1px solid transparent;
  padding:4px!important;cursor:pointer;
}
.slot-chip,.slot-empty{
  height:100%;min-height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.slot-chip{
  background:var(--c);color:var(--t);
  font-weight:700;font-size:11px;line-height:1.05;letter-spacing:-.02em;
  padding:2px 4px 2px 8px;overflow:hidden;text-align:center;
  box-shadow:inset 4px 0 0 var(--a);
}
.slot-chip span{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;
  overflow:hidden;overflow-wrap:anywhere;max-height:2.2em;
}
.slot-chip.pop,.slot-empty.pop{animation:chipPop .42s cubic-bezier(.16,1.4,.3,1) both;transform-origin:center}
@keyframes chipPop{0%{transform:scale(.62);opacity:.15}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
#board.enter-next .plan-table tbody tr,
#board.enter-prev .plan-table tbody tr,
#board.enter-fade .week-col,
#board.enter-fade .plan-table tbody tr{animation:boardIn .38s cubic-bezier(.16,1,.3,1) both}
#board.enter-next .plan-table tbody tr{animation-name:boardNext}
@keyframes boardNext{from{opacity:0;transform:translate3d(22px,0,0)}to{opacity:1;transform:none}}
@keyframes boardIn{from{opacity:0;transform:translate3d(-22px,0,0)}to{opacity:1;transform:none}}
#board.enter-prev .plan-table tbody tr{animation-name:boardIn}
.slot-empty{
  border:0;color:transparent;
  background:color-mix(in srgb, var(--text) 7%, transparent);
}
.td-slot.is-selected .slot-chip,.td-slot.is-selected .slot-empty,.td-slot.drag-hl .slot-chip,.td-slot.drag-hl .slot-empty{
  outline:2px solid var(--accent);outline-offset:1px;
}
.td-slot.drag-hl .slot-empty,.td-slot.is-selected .slot-empty{background:var(--accent-soft)}
.td-slot.is-now{box-shadow:inset 3px 0 0 var(--accent)}
@media (hover:hover) and (pointer:fine){
  .td-slot:hover .slot-empty{background:var(--accent-soft)}
}

.week-scroller{
  display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:12px;scrollbar-width:thin;
}
.week-col{
  flex:0 0 88%;scroll-snap-align:center;
  background:var(--elev-2);border:1px solid var(--line);border-radius:16px;
  min-width:0;display:flex;flex-direction:column;overflow:hidden;
}
.week-col.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.week-hd{
  width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  background:var(--elev-3);color:var(--text);
  padding:12px 12px 10px;display:flex;align-items:baseline;gap:8px;
}
.week-col.is-today .week-hd{background:var(--accent);color:var(--accent-ink)}
.week-wd{font-weight:700;font-size:16px;letter-spacing:.02em}
.week-dt{font-family:var(--mono);font-size:12px;opacity:.8}
.week-count{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600}
.wscale,.wrow{display:grid;grid-template-columns:minmax(76px,34%) 1fr;gap:8px;align-items:center;padding:0 10px}
.wscale{padding-top:8px;padding-bottom:2px}
.wrow{min-height:32px}
.wname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wscale-bar{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-faint)}
.wscale-bar i{font-style:normal}
.wbar{display:flex;gap:1px;height:20px;align-items:stretch}
.seg{flex:1;border-radius:2px;background:var(--track);min-width:2px}
.seg.on{background:var(--c)}
.week-rows{padding:4px 0 10px;display:flex;flex-direction:column;gap:2px}

.legend-wrap{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--elev);
  min-height:56px;
}
.legend-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);flex:0 0 auto}
.legend{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none;padding:2px 0}
@media (max-width:899px){
  .legend{mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent)}
}
.legend::-webkit-scrollbar{display:none}
.leg{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  height:40px;padding:0 14px 0 16px;border-radius:999px;
  border:1px solid color-mix(in srgb, var(--a) 45%, transparent);
  background:var(--c);color:var(--t);font-weight:700;font-size:13px;
  box-shadow:inset 4px 0 0 var(--a);
}
body.is-editing .leg{padding-right:6px}
.leg-del{
  display:none;
  width:28px;height:28px;border-radius:50%;border:0;
  background:color-mix(in srgb, var(--t) 16%, transparent);color:inherit;font-size:14px;line-height:1;
  place-items:center;
}
body.is-editing .leg-del{display:grid}
.leg-empty{color:var(--text-faint);font-size:13px}

.assign-bar{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:40;display:flex;align-items:center;gap:8px;
  padding:10px;border-radius:18px;
  background:var(--elev);border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
.assign-count{font-weight:700;padding:0 6px;min-width:72px}
.assign-bar .btn{flex:1}

.modal-bg{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(4,8,14,.62);backdrop-filter:blur(4px);
  align-items:flex-end;justify-content:center;
}
.modal-bg.open{display:flex}
.modal{
  width:min(560px,100%);max-height:min(88dvh,720px);overflow:auto;
  background:var(--elev);color:var(--text);
  border-radius:22px 22px 0 0;border:1px solid var(--line);
  padding:10px 16px calc(16px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow);animation:sheet .2s ease;
}
@keyframes sheet{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet-handle{width:42px;height:4px;border-radius:99px;background:var(--line-strong);margin:4px auto 10px}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-title{font-size:18px;font-weight:700;letter-spacing:-.02em}
.modal-sub{color:var(--text-dim);font-size:13px;margin-top:3px}
.modal-x{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--elev-2);color:var(--text);font-size:18px;flex:0 0 auto;
}
.chatter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ch-btn{
  min-height:52px;border:0;border-radius:12px;padding:10px 8px 10px 14px;
  background:var(--c);color:var(--t);font-weight:700;font-size:15px;
  box-shadow:inset 4px 0 0 var(--a);
}
.ch-btn.clear{
  grid-column:1/-1;background:var(--elev-2);color:var(--text);
  border:1px solid var(--line-strong);box-shadow:none;font-weight:600;
}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}
.modal-foot .btn{flex:1}
.form-row{margin-bottom:14px}
.form-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.form-input{
  width:100%;height:48px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--elev-2);color:var(--text);padding:0 12px;font-size:16px;
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.form-error{color:var(--danger);font-size:13px;margin-top:6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.sel{border-color:var(--text);box-shadow:0 0 0 2px var(--elev),0 0 0 4px var(--text)}
.preview-pill{
  display:inline-flex;align-items:center;margin-top:10px;min-height:36px;padding:6px 14px 6px 16px;border-radius:999px;
  font-weight:700;font-size:13px;
  background:var(--c);color:var(--t);box-shadow:inset 4px 0 0 var(--a);
}
.repeat-info{
  font-size:14px;font-weight:600;padding:10px 12px;border-radius:12px;
  background:var(--elev-2);color:var(--text);margin-bottom:12px;
}
.repeat-days{display:flex;gap:6px;margin-bottom:14px}
.rd-btn{
  flex:1;min-height:56px;border-radius:12px;border:1px solid var(--line-strong);
  background:var(--elev-2);color:var(--text-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:700;
}
.rd-btn span:last-child{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text)}
.rd-btn.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rd-btn.active span:last-child{color:var(--accent-ink)}
.rd-btn.today,.rd-btn:disabled{cursor:default;opacity:1}

.empty{
  padding:32px 20px;text-align:center;color:var(--text-dim);
}
.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

.loading-overlay{
  position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--bg);transition:opacity .35s ease;
}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-overlay img{
  width:72px;height:72px;border-radius:18px;background:#000;
  box-shadow:0 0 36px rgba(62,200,255,.45);

}

.loading-text{color:var(--text-dim);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.loading-bar{width:180px;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.loading-bar-inner{height:100%;width:40%;background:var(--accent);border-radius:99px;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.skel{width:min(280px,72vw);display:flex;flex-direction:column;gap:8px}
.skel-row{
  height:12px;border-radius:8px;
  background:linear-gradient(90deg,var(--line) 20%,color-mix(in srgb,var(--accent) 45%, var(--line)) 50%,var(--line) 80%);
  background-size:200% 100%;
  animation:shimmer 1.15s linear infinite;
}
.skel-row:nth-child(2){width:84%}
.skel-row:nth-child(3){width:66%}
@keyframes shimmer{to{background-position:-200% 0}}
.toast{
  position:fixed;left:50%;top:72px;
  z-index:70;padding:12px 18px;border-radius:999px;
  background:color-mix(in srgb, var(--elev) 88%, transparent);
  backdrop-filter:blur(16px);
  border:1px solid color-mix(in srgb, var(--ok) 55%, var(--line));
  box-shadow:0 10px 30px rgba(0,0,0,.28), 0 0 0 4px rgba(61,214,140,.12);
  color:var(--text);font-weight:700;letter-spacing:-.01em;
  transform:translate3d(-50%,-10px,0) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .28s ease, transform .45s cubic-bezier(.16,1,.3,1);
}
.toast.show{opacity:1;transform:translate3d(-50%,0,0) scale(1)}

@media (max-width:359px){
  .sync-text{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
}
@media (min-width:900px){
  :root{--name-col:200px;--slot-min:76px;--row-h:58px}
  .topbar{padding:12px 20px 0}
  .toolbar{flex-direction:row;align-items:center;padding:10px 20px 12px}
  .tool-cluster{margin-left:auto}
  .tool-cluster .btn{flex:0 0 auto}
  .day-label{flex:0 1 auto;min-width:220px;font-size:16px}
  .day-strip{padding:0 20px 12px;gap:6px}
  .day-chip{max-width:120px}
  .edit-banner{margin:0 20px 10px}
  .stat{padding:10px 8px 12px}
  .stat-num{font-size:18px}
  .board-scroll{margin:0 16px 12px;border:1px solid var(--line);border-radius:18px}
  .week-scroller{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:visible;gap:8px;height:100%}
  .board-scroll.is-week #board{height:100%}
  .week-col{flex:unset;scroll-snap-align:none;height:100%;overflow:auto}
  .week-rows{flex:1;justify-content:space-evenly}
  .wscale,.wrow{grid-template-columns:minmax(64px,38%) 1fr;padding:0 8px}
  .wname{font-size:11px}
  .wbar{height:16px}
  .legend-wrap{margin:0 16px 12px;border:1px solid var(--line);border-radius:16px;padding:8px 12px}
  .legend{flex-wrap:wrap;overflow:visible}
  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:20px;padding:18px 18px 16px;animation-name:pop}

  .modal-foot .btn{flex:0 0 auto;min-width:120px}
  @keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<body>
<div class="loading-overlay" id="loadingOverlay">
  <img src="logo.jpg" alt="Nakama" width="72" height="72">

<div class="shell">

<div class="assign-bar" id="assignBar" hidden>
  <div class="assign-count" id="assignCount">0</div>
  <button type="button" class="btn" id="assignClear">Zurück</button>

<div class="modal-bg" id="addChatterModal">

<script>
var DAYS=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
var DAYS_S=["Mo","Di","Mi","Do","Fr","Sa","So"];
var HOURS=[];
for(var i=0;i<24;i++) HOURS.push((i<10?"0":"")+i+":00");
var COLORS=["#1da1f2","#e53935","#8e24aa","#00897b","#f4511e","#6d4c41","#0097a7","#c0ca33","#fb8c00","#43a047","#546e7a","#d81b60"];
var FB="https://nakama-schichtplan-default-rtdb.firebaseio.com/plan.json";
var THEME_KEY="nakama_theme";
var OFFLINE=/[?&]offline=1(?:&|$)/.test(location.search);

var dayOffset=0;
var weekViewOffset=0;
var viewMode="day";
var profiles=["Eva","Marie","Ann Christin","Larissa","Carissa","Olivia","Lilly","Julia","Lizzardqueen","MelinaMars","Sophia","Malea"];
var chatters=[
  {name:"Leti",color:"#43a047"},{name:"Chris",color:"#e53935"},
  {name:"Nastja",color:"#8e24aa"},{name:"Taner",color:"#00897b"},
  {name:"Niklas",color:"#1da1f2"},{name:"Michel",color:"#546e7a"},
  {name:"Massie",color:"#fb8c00"}
];
var slots={};
var selColor=COLORS[0];
var lastHash="";
var dragActive=false, dragPiStart=-1, dragPiEnd=-1, dragHiStart=-1, dragHiEnd=-1;
var pendingCell=null, pendingRepeat=null;
var tapSel={};
var press=null;
var scrollMode="focus";
var blockClicksUntil=0;
var ICON_PREV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>';
var ICON_NEXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 L16 12 L9 19"/></svg>';
var ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>';
var ICON_INFO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8h.01"/></svg>';
var ICON_EDIT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
var editMode=false;

function getMonday(){
  var d=new Date(), wd=d.getDay();
  var m=new Date(d); m.setDate(d.getDate()-(wd===0?6:wd-1)); m.setHours(0,0,0,0); return m;
}
function offToDate(off){
  var m=getMonday(), r=new Date(m); r.setDate(m.getDate()+off); return r;
}
function todayOff(){
  var wd=new Date().getDay(); return (wd===0?6:wd-1);
}
function sk(p,h,o){ return "d"+o+"|"+p+"|"+h; }
function getSlot(p,h,o){ return slots[sk(p,h,o)]||""; }
var popKeys={};
var boardAnim="";
function setSlot(p,h,v,o){
  var k=sk(p,h,o);
  var prev=slots[k]||"";
  if(v==="")delete slots[k]; else slots[k]=v;
  if((v||"")!==prev) popKeys[k]=1;
}

function isMobile(){ return window.matchMedia("(max-width: 899px)").matches; }
function useTapSelect(){ return window.matchMedia("(max-width: 899px), (pointer: coarse)").matches; }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function safeColor(c){
  if(typeof c!=="string") return "#8b93a7";
  var t=c.trim();
  if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(t)) return t;
  return "#8b93a7";
}
function hexToRgb(hex){
  var h=hex.replace("#","");
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function mixHex(a,b,t){
  var A=hexToRgb(safeColor(a)), B=hexToRgb(b), h="#";
  for(var i=0;i<3;i++){
    var v=Math.round(A[i]*(1-t)+B[i]*t);
    var s=v.toString(16);
    h+=(s.length<2?"0":"")+s;
  }
  return h;
}
function isDarkTheme(){ return document.documentElement.getAttribute("data-theme")!=="light"; }
function chipStyle(color){
  var c=safeColor(color);
  var dark=isDarkTheme();
  var bg=dark?mixHex(c,"#10141c",0.55):mixHex(c,"#ffffff",0.72);
  var text=dark?"#f4f7fb":"#14161a";
  return "--c:"+bg+";--t:"+text+";--a:"+c;
}
function barStyle(color){ return "--c:"+safeColor(color); }
function hourBand(h){ if(h<6) return "h-night"; if(h<12) return "h-morning"; if(h<18) return "h-day"; return "h-evening"; }
function findCh(name){ for(var i=0;i<chatters.length;i++) if(chatters[i].name===name) return chatters[i]; return null; }

function setSyncStatus(s,t){
  var dot=document.getElementById("syncDot"), el=document.getElementById("syncText"), box=document.getElementById("syncStatus");
  if(!dot||!el) return;
  dot.className="sync-dot"+(s==="syncing"?" syncing":s==="error"?" error":"");
  var full=String(t);
  var clock=full.match(/\d{1,2}:\d{2}/);
  el.textContent=(isMobile()&&clock)?clock[0]:full;
  if(box) box.title=full;
}
var toastTimer=0;
function showToast(msg){
  var t=document.getElementById("toast");
  if(!t) return;
  t.textContent=msg;
  t.classList.remove("show");
  void t.offsetWidth;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 2200);
}
function saveLocal(){
  if(OFFLINE) return;
  try{ localStorage.setItem("nakama_v3",JSON.stringify({slots:slots,profiles:profiles,chatters:chatters})); }catch(e){}
}
function loadLocal(){
  if(OFFLINE) return;
  try{
    var r=localStorage.getItem("nakama_v3");
    if(r){
      var d=JSON.parse(r);
      if(d.slots) slots=d.slots;
      if(d.profiles&&d.profiles.length) profiles=d.profiles;
      if(d.chatters&&d.chatters.length) chatters=d.chatters;
    }
  }catch(e){}
}
function push(){
  if(OFFLINE){ setSyncStatus("ok","Lokal"); showToast("Gespeichert"); return; }
  setSyncStatus("syncing","Speichern…");
  var body=JSON.stringify({slots:slots,profiles:profiles,chatters:chatters,ts:Date.now()});
  var x=new XMLHttpRequest();
  x.open("PUT",FB,true);
  x.setRequestHeader("Content-Type","application/json");
  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(x.status>=200&&x.status<300){
        lastHash=body.length+"";
        setSyncStatus("ok","OK "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
        showToast("Gespeichert");
      }else setSyncStatus("error","Fehler "+x.status);
    }
  };
  x.send(body);
}
function pull(){
  if(OFFLINE) return;
  var x=new XMLHttpRequest();
  x.open("GET",FB,true);
  x.onreadystatechange=function(){
    if(x.readyState===4&&x.status===200&&x.responseText&&x.responseText!=="null"){
      try{
        var h=x.responseText.length+"";
        if(h!==lastHash){
          lastHash=h;
          var d=JSON.parse(x.responseText);
          if(d.slots) slots=d.slots;
          if(d.profiles&&d.profiles.length) profiles=d.profiles;
          if(d.chatters&&d.chatters.length) chatters=d.chatters;
          saveLocal();
          render();
          setSyncStatus("ok","Sync "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}));
          hideOverlay();
        }
      }catch(e){ setSyncStatus("error","Fehler"); }
    }
  };
  x.send();
}
function syncAndRender(){ saveLocal(); render(); push(); }
function seedOffline(){
  if(!OFFLINE || Object.keys(slots).length) return;
  for(var pi=0;pi<profiles.length;pi++){
    for(var d=0;d<7;d++){
      var ch=chatters[(pi+d)%chatters.length];
      var start=(pi*3)%10;
      for(var h=start;h<Math.min(24,start+7);h++) setSlot(profiles[pi], h, ch.name, d);
    }
  }
}

function systemTheme(){
  return window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", theme==="light"?"#eef1f6":"#0b0d12");
  var btn=document.getElementById("themeBtn");
  if(!btn) return;
  var dark=theme!=="light";
  btn.innerHTML=dark?ICON_SUN:ICON_MOON;
  btn.setAttribute("aria-label", dark?"Helles Design einschalten":"Dunkles Design einschalten");
  btn.setAttribute("aria-pressed", dark?"true":"false");
}
function initTheme(){
  var saved=null;
  try{ saved=localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme((saved==="light"||saved==="dark")?saved:systemTheme());
  var mq=window.matchMedia("(prefers-color-scheme: light)");
  var onChange=function(){
    var s=null; try{ s=localStorage.getItem(THEME_KEY); }catch(e){}
    if(s!=="light"&&s!=="dark"){ applyTheme(systemTheme()); scrollMode="preserve"; render(); }
  };
  if(mq.addEventListener) mq.addEventListener("change", onChange);
  else if(mq.addListener) mq.addListener(onChange);
}
function toggleTheme(){
  var next=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme(next);
  scrollMode="preserve";
  render();
}
function toggleEdit(){
  editMode=!editMode;
  document.body.classList.toggle("is-editing", editMode);
  var b=document.getElementById("editBtn");
  b.classList.toggle("is-on", editMode);
  b.setAttribute("aria-pressed", editMode?"true":"false");
  b.setAttribute("aria-label", editMode?"Bearbeiten beenden":"Bearbeiten");
  document.getElementById("editBanner").hidden=!editMode;
}
function hintText(){
  if(viewMode==="week") return "Tippe einen Tag an, um die Schichten dieses Tages zu bearbeiten.";
  if(useTapSelect()) return "Tippe Slots an und wähle Zuweisen. Halten und ziehen markiert einen Block. Seitlich wischen zeigt weitere Stunden.";
  return "Ziehen markiert einen Zeitraum über Stunden und Profile.";
}
function toggleInfo(force){
  var pop=document.getElementById("infoPop");
  var btn=document.getElementById("infoBtn");
  var open=force===false?false:(force===true?true:pop.hidden);
  pop.hidden=!open;
  btn.setAttribute("aria-expanded", open?"true":"false");
  if(!open) return;
  pop.textContent=hintText();

function renderStats(tot,ua){
  var next=[profiles.length, chatters.length, tot, Object.keys(ua).length];
  var bar=document.getElementById("statsBar");
  if(bar.children.length!==4){
    var html="";
    for(var i=0;i<4;i++) html+="<div class='stat'><div class='stat-num' data-i='"+i+"'>0</div><div class='stat-lbl'>"+statLabels[i]+"</div></div>";
    bar.innerHTML=html;
    statValues=[0,0,0,0];
  }
  for(var j=0;j<4;j++) animateStat(j, next[j]);
}
function animateStat(i,target){
  var el=document.querySelector('.stat-num[data-i="'+i+'"]');
  if(!el) return;
  var from=statValues[i]==null?0:statValues[i];
  statValues[i]=target;
  if(from===target){ el.textContent=String(target); return; }
  var start=performance.now(), dur=380;
  el.parentNode.classList.remove("stat-pop");
  void el.offsetWidth;
  el.parentNode.classList.add("stat-pop");
  function tick(now){
    if(statValues[i]!==target) return;
    var t=Math.min(1,(now-start)/dur);
    var e=1-Math.pow(1-t,3);
    el.textContent=String(Math.round(from+(target-from)*e));
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function describeCells(cells){
  var piSet={};
  var minPi=1e9,maxPi=-1,minHi=1e9,maxHi=-1;
  for(var i=0;i<cells.length;i++){
    var c=cells[i];
    piSet[c.pi]=1;
    if(c.pi<minPi) minPi=c.pi; if(c.pi>maxPi) maxPi=c.pi;
    if(c.hi<minHi) minHi=c.hi; if(c.hi>maxHi) maxHi=c.hi;
  }
  var pis=[]; for(var k in piSet) pis.push(parseInt(k,10));
  pis.sort(function(a,b){return a-b;});
  var pCount=pis.length;
  var isRect=cells.length===(maxPi-minPi+1)*(maxHi-minHi+1) && pCount===(maxPi-minPi+1);
  var title=pCount===1?profiles[pis[0]]:profiles[pis[0]]+" + "+(pCount-1)+" weitere";
  var sub;
  if(isRect) sub=HOURS[minHi]+(minHi!==maxHi?" – "+HOURS[maxHi]:"")+" Uhr · "+pCount+(pCount===1?" Profil":" Profile");
  else sub=cells.length+(cells.length===1?" Slot":" Slots")+" · "+pCount+(pCount===1?" Profil":" Profile");
  return {title:title,sub:sub,names:pis.map(function(pi){return profiles[pi];})};
}

function exportCSV(){
  var csv="";
  if(viewMode==="week"){
    var base2=weekViewOffset*7, offs2=[];
    for(var i=0;i<7;i++) offs2.push(base2+i);
    csv="Profil";
    for(var di3=0;di3<7;di3++) csv+=","+DAYS[di3];
    csv+=",Summe\n";
    for(var pi3=0;pi3<profiles.length;pi3++){
      csv+=profiles[pi3]; var sum3=0;
      for(var di4=0;di4<7;di4++){
        var names=[];
        for(var hi3=0;hi3<24;hi3++){
          var sv3=getSlot(profiles[pi3],hi3,offs2[di4]);
          if(sv3){ if(names.indexOf(sv3)===-1) names.push(sv3); sum3++; }
        }
        csv+=","+(names.join("+")||"");
      }
      csv+=","+sum3+"\n";
    }
  }else{
    csv="Profil";
    for(var h4=0;h4<24;h4++) csv+=","+HOURS[h4];
    csv+=",Summe\n";
    for(var pi4=0;pi4<profiles.length;pi4++){
      csv+=profiles[pi4]; var sum4=0;
      for(var hi4=0;hi4<24;hi4++){
        var sv4=getSlot(profiles[pi4],hi4,dayOffset);
        if(sv4) sum4++;
        csv+=","+(sv4||"");
      }
      csv+=","+sum4+"\n";
    }
  }
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download="nakama_schichtplan.csv"; a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("board").addEventListener("click",function(e){
  if(Date.now()<blockClicksUntil) return;
  var del=e.target.closest(".del-btn");
  if(del){
    if(!editMode) return;
    var pi=parseInt(del.getAttribute("data-pi"),10);
    if(confirm("Profil entfernen?")){ profiles.splice(pi,1); tapSel={}; syncAndRender(); }
    return;
  }
  var jump=e.target.closest("[data-jump]");
  if(jump){
    boardAnim="enter-fade";
    dayOffset=parseInt(jump.getAttribute("data-jump"),10);
    viewMode="day";
    tapSel={};
    scrollMode="focus";
    render();
    return;
  }
  var slot=e.target.closest(".td-slot");
  if(slot && useTapSelect()){
    var k=slot.getAttribute("data-pi")+"|"+slot.getAttribute("data-hi");
    if(tapSel[k]) delete tapSel[k]; else tapSel[k]=1;
    paintSelection();
  }
});
document.getElementById("legend").addEventListener("click",function(e){
  var del=e.target.closest(".leg-del");
  if(!del||!editMode) return;
  var ci=parseInt(del.getAttribute("data-ci"),10);
  if(confirm("Chatter entfernen?")){ chatters.splice(ci,1); syncAndRender(); }
});
document.getElementById("board").addEventListener("pointerdown",function(e){
  var slot=e.target.closest(".td-slot");
  if(!slot) return;
  if(e.target.closest(".del-btn")) return;
  if(useTapSelect()){
    press={
      id:e.pointerId,
      x:e.clientX, y:e.clientY,
      pi:parseInt(slot.getAttribute("data-pi"),10),
      hi:parseInt(slot.getAttribute("data-hi"),10),
      active:false,
      timer:null
    };
    press.timer=setTimeout(function(){
      if(!press) return;
      press.active=true;
      selectRect(press.pi, press.hi, press.pi, press.hi);
      paintSelection();
      if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
    }, 320);
    return;
  }
  if(e.pointerType!=="mouse"||e.button!==0) return;
  e.preventDefault();
  dragActive=true;
  dragPiStart=dragPiEnd=parseInt(slot.getAttribute("data-pi"),10);
  dragHiStart=dragHiEnd=parseInt(slot.getAttribute("data-hi"),10);
  scrollMode="preserve";
  render();
});
document.getElementById("board").addEventListener("pointerover",function(e){
  if(!dragActive||useTapSelect()) return;
  var slot=e.target.closest(".td-slot");
  if(!slot) return;
  var pi=parseInt(slot.getAttribute("data-pi"),10), hi=parseInt(slot.getAttribute("data-hi"),10);
  if(pi===dragPiEnd && hi===dragHiEnd) return;
  dragPiEnd=pi; dragHiEnd=hi;
  scrollMode="preserve";
  render();
});
document.addEventListener("pointermove",function(e){
  if(!press) return;
  var dx=e.clientX-press.x, dy=e.clientY-press.y;
  if(!press.active){
    if(dx*dx+dy*dy>100){ clearTimeout(press.timer); press=null; }
    return;
  }
  if(e.cancelable) e.preventDefault();
  var el=document.elementFromPoint(e.clientX, e.clientY);
  var slot=el&&el.closest?el.closest(".td-slot"):null;
  if(!slot) return;
  var pi=parseInt(slot.getAttribute("data-pi"),10), hi=parseInt(slot.getAttribute("data-hi"),10);
  selectRect(press.pi, press.hi, pi, hi);
  paintSelection();
},{passive:false});
function endPress(commitOutside){
  if(!press) return;
  clearTimeout(press.timer);
  if(press.active) blockClicksUntil=Date.now()+280;
  press=null;
}
document.addEventListener("pointerup",function(e){
  endPress();
  if(!dragActive) return;
  var piMin=Math.min(dragPiStart,dragPiEnd), piMax=Math.max(dragPiStart,dragPiEnd);
  var hiMin=Math.min(dragHiStart,dragHiEnd), hiMax=Math.max(dragHiStart,dragHiEnd);
  var el=document.elementFromPoint(e.clientX, e.clientY);
  var inside=!!(el&&el.closest&&el.closest("#board"));
  dragActive=false;
  dragPiStart=dragPiEnd=dragHiStart=dragHiEnd=-1;
  if(!inside){ scrollMode="preserve"; render(); return; }
  var cells=[];
  for(var p=piMin;p<=piMax;p++) for(var h=hiMin;h<=hiMax;h++) cells.push({pi:p,hi:h});
  scrollMode="preserve";
  render();
  openChatterModal(cells);
});
document.addEventListener("pointercancel",function(){
  if(press){ clearTimeout(press.timer); press=null; }
  if(dragActive){
    dragActive=false; dragPiStart=dragPiEnd=dragHiStart=dragHiEnd=-1;
    scrollMode="preserve"; render();
  }
});
document.addEventListener("click",function(e){
  if(Date.now()<blockClicksUntil){
    e.preventDefault();
    e.stopPropagation();
  }
},true);
document.addEventListener("keydown",function(e){
  var tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"){
    if(e.key==="Escape"){
      closeChModal(); closeAddChatter(); closeAddProfile();
      if(pendingRepeat){ closeRepeatModal(); syncAndRender(); }
    }
    return;
  }
  if(e.key==="Escape"){
    var repeatOpen=document.getElementById("repeatModal").classList.contains("open");
    closeChModal(); closeAddChatter(); closeAddProfile();
    if(repeatOpen){ closeRepeatModal(); syncAndRender(); }
    else if(selectedCells().length) clearTap();
    return;
  }
  if(document.querySelector(".modal-bg.open")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); shiftNav(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); shiftNav(1); }
});
document.getElementById("boardScroll").addEventListener("scroll",updateScrollShadow,{passive:true});
document.addEventListener("click",function(e){
  if(e.target.closest("#infoBtn")||e.target.closest("#infoPop")) return;
  if(!document.getElementById("infoPop").hidden) toggleInfo(false);
});

var lastMobile=isMobile();
window.addEventListener("resize",function(){
  var m=isMobile();
  var box=document.getElementById("syncStatus");
  if(box&&box.title){
    var dot=document.getElementById("syncDot");
    var state=dot.classList.contains("syncing")?"syncing":dot.classList.contains("error")?"error":"ok";
    setSyncStatus(state, box.title);
  }
  if(m!==lastMobile){ lastMobile=m; scrollMode="preserve"; render(); }
});

initTheme();
dayOffset=todayOff();
loadLocal();
seedOffline();
render();
if(OFFLINE) setSyncStatus("ok","Lokal");
pull();
setTimeout(hideOverlay, 1100);
setInterval(pull, 10000);
</script>
</body>
</html>
